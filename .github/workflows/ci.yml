name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的新推送会取消仍在跑的旧任务，避免排队浪费。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: 后端（build / vet / test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 从 go.mod 读版本，避免与 toolchain 指令冲突。
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # 防止 require 块与实际 import 漂移（例如直接依赖被误标为 indirect）。
      - name: 校验 go.mod / go.sum 已同步
        run: go mod tidy -diff

      - name: 构建
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # 这些测试不依赖 MySQL / Redis / RabbitMQ：外部 HTTP 依赖用 httptest 打桩，
      # 配置里的 127.0.0.1 只是字符串固件。因此无需 service containers。
      # 需要本机 ONNX Runtime 的集成测试由 GOPHERAI_RUN_ONNX_INTEGRATION 控制，默认跳过。
      - name: 测试
        run: go test -race ./...

  agent-recovery-e2e:
    name: Agent 崩溃恢复 E2E（真实 MySQL）
    runs-on: ubuntu-latest

    # 这个测试 fork 真实子进程、SIGKILL 掉它，再由第二个进程接管续跑。
    # 它是「非幂等工具绝不自动重放」这条安全不变量的唯一端到端证明，
    # 因此必须常态化运行，不能只靠开发者本地手动开启。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: gopherai
          MYSQL_DATABASE: gopherai_agent_e2e
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pgopherai"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # -count=1 关闭结果缓存：恢复行为依赖真实时序与外部数据库状态，
      # 缓存命中会让这个测试静默失去意义。
      - name: 崩溃—重启—续跑
        env:
          GOPHERAI_AGENT_E2E_MYSQL_DSN: root:gopherai@tcp(127.0.0.1:13306)/gopherai_agent_e2e?parseTime=true&loc=UTC
        run: go test -tags integration ./service/agent -run TestAgentProcessCrashRecovery -count=1 -v

  mcp-module:
    name: MCP 子模块
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # common/mcp 是独立 Go module，根目录的 go build/test ./... 覆盖不到它。
      - uses: actions/setup-go@v5
        with:
          go-version-file: common/mcp/go.mod
          cache-dependency-path: common/mcp/go.sum

      - name: 构建与测试
        working-directory: common/mcp
        run: |
          go mod tidy -diff
          go build ./...
          go vet ./...
          go test -race ./...

  frontend:
    name: 前端（lint / build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: vue-frontend/package-lock.json

      - name: 安装依赖
        working-directory: vue-frontend
        run: npm ci

      - name: Lint
        working-directory: vue-frontend
        run: npm run lint -- --no-fix --max-warnings=0

      - name: 构建
        working-directory: vue-frontend
        run: npm run build
