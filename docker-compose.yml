name: gopherai

# Local-development infrastructure. Every published port is bound to loopback
# so Docker does not expose MySQL, Redis, AMQP, or RabbitMQ management to the
# local network. Use docker-compose.production.yml for the stricter production
# profile and set real GOPHERAI_* secrets through the deployment environment.
services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${GOPHERAI_MYSQL_ROOT_PASSWORD:-gopherai_root_dev_password}
      MYSQL_DATABASE: ${GOPHERAI_MYSQL_DATABASE:-gopherai}
      MYSQL_USER: ${GOPHERAI_MYSQL_USER:-gopherai}
      MYSQL_PASSWORD: ${GOPHERAI_MYSQL_PASSWORD:-gopherai_dev_password}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${GOPHERAI_MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    # Redis Stack is required because RAG uses RediSearch FT.* commands.
    image: redis/redis-stack-server:7.4.0-v8
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${GOPHERAI_REDIS_PASSWORD:-gopherai_redis_dev_password}
      REDIS_ARGS: "--requirepass ${GOPHERAI_REDIS_PASSWORD:-gopherai_redis_dev_password}"
    ports:
      - "127.0.0.1:${GOPHERAI_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3.4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${GOPHERAI_RABBITMQ_USERNAME:-gopherai}
      RABBITMQ_DEFAULT_PASS: ${GOPHERAI_RABBITMQ_PASSWORD:-gopherai_dev_password}
      RABBITMQ_DEFAULT_VHOST: ${GOPHERAI_RABBITMQ_VHOST:-gopherai}
    ports:
      - "127.0.0.1:${GOPHERAI_RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${GOPHERAI_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
