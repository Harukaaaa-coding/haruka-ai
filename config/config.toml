# Development-only defaults. These values intentionally contain no real
# credentials. Replace them securely before any non-local deployment.

[mainConfig]
appName = "GopherAI"
host = "127.0.0.1"
port = 9090

[emailConfig]
# The current email implementation uses smtp.163.com:465 with implicit TLS.
authcode = ""
email = ""

[redisConfig]
host = "127.0.0.1"
port = 6379
# Matches the local docker-compose.yml default. Set a real secret with
# GOPHERAI_REDIS_PASSWORD before a non-local deployment.
password = "gopherai_redis_dev_password"
db = 0

[mysqlConfig]
host = "127.0.0.1"
port = 13306
user = "gopherai"
password = "gopherai_dev_password"
databaseName = "gopherai"
charset = "utf8mb4"

[jwtConfig]
expire_duration = 24
issuer = "gopherai-local"
subject = "gopherai-user"
key = "dev-only-change-before-production"

[rabbitmqConfig]
host = "127.0.0.1"
port = 5672
username = "gopherai"
password = "gopherai_dev_password"
vhost = "gopherai"

[ragModelConfig]
embeddingModel = "embeddinggemma:latest"
chatModelName = "deepseek-r1:1.5b"
docDir = "./uploads"
baseUrl = "http://127.0.0.1:11434/v1"
# Must match the output dimension of the selected embedding model.
dimension = 768
minScore = 0.25
candidateFactor = 4
rrfK = 60
rerankEnabled = true

[ollamaConfig]
baseUrl = "http://127.0.0.1:11434"
modelName = "deepseek-r1:1.5b"

[voiceServiceConfig]
# Baidu Intelligent Cloud long-text TTS credentials; leave blank when unused.
voiceServiceApiKey = ""
voiceServiceSecretKey = ""

[voiceRealtimeConfig]
# Server-side ASR provider ID. `baidu-batch` reuses the existing short-audio
# recognizer; future realtime ASR adapters can be selected here.
asrProvider = "baidu-batch"
# Fish Audio S2 is optional. Keep all four values empty to expose text/ASR
# events only; never put real secrets in this tracked development file.
fishAudioApiKey = ""
fishAudioBaseUrl = "https://api.fish.audio"
fishAudioModel = "s2-pro"
fishAudioReferenceId = ""
# Comma-separated browser origins. Production should set this explicitly.
allowedOrigins = ""
